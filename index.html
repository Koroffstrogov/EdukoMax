<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="EdukoMax, une application de maths lisible et ludique pour enfants."
    >
    <title>EdukoMax</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/themes.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <div id="app" data-app-root>
      <main class="loading-shell" aria-live="polite">
        <p>EdukoMax se pr&eacute;pare...</p>
      </main>
    </div>
    <script type="module">
      if (location.protocol === "file:") {
        startFileApp();
      } else {
        import("./js/app.js").catch(showBootError);
      }

      function startFileApp() {
        const root = document.querySelector("[data-app-root]");

        if (!root) {
          return;
        }

        const tables = [2, 5, 10, 3, 4, 6, 8, 9, 7];
        const initialTables = [2, 5, 10];
        const themes = [
          fileTheme("sunny", "Soleil", "Clair, chaud et joyeux.", 0, ["#2563eb", "#14b8a6", "#facc15"]),
          fileTheme("ocean", "Océan", "Frais, calme et concentré.", 8, ["#0f76c9", "#10b981", "#fde047"]),
          fileTheme("berry", "Fruits", "Vif, doux et pétillant.", 10, ["#c026d3", "#22c55e", "#f97316"])
        ];
        const modeItems = [
          fileMode("direct-answer", "Réponse directe", "Écris le résultat.", 0),
          fileMode("multiple-choice", "Choix rapide", "Choisis parmi 4 réponses.", 4, "correct-total", 4),
          fileMode("visual-groups", "Groupes visuels", "Compte les petits groupes.", 4, "correct-total", 4),
          fileMode("missing-factor", "Facteur caché", "Trouve le nombre manquant.", 8, "table", 3),
          fileMode("mixed", "Mode mélange", "Toutes les formes en session.", 12, "mixed", 0)
        ];
        const tableItems = [
          fileTableItem(3, 6, [2, 5, 10], 6),
          fileTableItem(4, 6, [3], 6),
          fileTableItem(6, 8, [4], 8),
          fileTableItem(8, 8, [6], 8),
          fileTableItem(9, 10, [8], 10),
          fileTableItem(7, 10, [9], 10)
        ];
        let save = loadFileSave();
        let route = getFileRoute();
        let fileSession = null;
        let fileAutoAdvanceTimer = null;

        document.documentElement.dataset.theme = save.settings.theme;
        saveFileSave(save);
        renderFileApp();

        window.addEventListener("hashchange", () => {
          route = getFileRoute();
          renderFileApp();
        });

        root.addEventListener("click", (event) => {
          const routeTarget = event.target.closest("[data-route]");
          const startTarget = event.target.closest("[data-start-session]");
          const submitTarget = event.target.closest("[data-submit-answer]");
          const buyTarget = event.target.closest("[data-buy-type][data-buy-id]");
          const answerTarget = event.target.closest("[data-session-answer]");
          const themeTarget = event.target.closest("[data-theme]");

          if (submitTarget) {
            event.preventDefault();
            if (submitFileAnswerForm(submitTarget.closest("[data-answer-form]"))) {
              renderFileApp();
            }
            return;
          }

          if (buyTarget) {
            buyFileItem(buyTarget.dataset.buyType, buyTarget.dataset.buyId);
            renderFileApp();
            return;
          }

          if (routeTarget) {
            location.hash = routeTarget.dataset.route;
            return;
          }

          if (startTarget) {
            fileSession = createFileSession(startTarget.dataset.startSession);
            route = "multiplication-session";
            location.hash = "multiplication-session";
            renderFileApp();
            return;
          }

          if (answerTarget) {
            answerFileSession(Number(answerTarget.dataset.sessionAnswer));
            renderFileApp();
            return;
          }

          if (event.target.closest("[data-next-question]")) {
            advanceFileSession();
            renderFileApp();
            return;
          }

          if (event.target.closest("[data-end-session]")) {
            fileSession = null;
            route = "multiplication";
            location.hash = "multiplication";
            renderFileApp();
            return;
          }

          if (themeTarget) {
            if (!isFileThemeOwned(themeTarget.dataset.theme)) {
              return;
            }

            save.settings.theme = normalizeFileTheme(themeTarget.dataset.theme);
            save.updatedAt = new Date().toISOString();
            document.documentElement.dataset.theme = save.settings.theme;
            saveFileSave(save);
            renderFileApp();
          }
        });

        root.addEventListener("submit", (event) => {
          const answerForm = event.target.closest("[data-answer-form]");

          if (!answerForm) {
            return;
          }

          event.preventDefault();
          if (submitFileAnswerForm(answerForm)) {
            renderFileApp();
          }
        });

        function renderFileApp() {
          clearFileAutoAdvance();
          document.title = getFilePageTitle(route);
          root.innerHTML = `
            <div class="app-shell">
              ${renderHeader()}
              <main id="main-content" class="app-main" tabindex="-1">
                ${renderCurrentFileView()}
              </main>
            </div>
          `;
          focusFileAnswerInput();
          scheduleFileAutoAdvance();
        }

        function renderCurrentFileView() {
          if (route === "multiplication") {
            return renderMultiplication();
          }

          if (route === "multiplication-session") {
            return renderFileSession();
          }

          if (route === "settings") {
            return renderSettings();
          }

          return renderHome();
        }

        function renderHeader() {
          return `
            <header class="topbar">
              <div class="brand" aria-label="EdukoMax">
                <span class="brand-mark" aria-hidden="true">EM</span>
                <span>
                  <span class="brand-name">EdukoMax</span>
                  <span class="brand-subtitle">Maths courtes et joyeuses</span>
                </span>
              </div>
              <nav class="topnav" aria-label="Navigation principale">
                ${renderNavButton("Accueil", "home")}
                ${renderNavButton("Multiplications", "multiplication")}
                ${renderNavButton("Réglages", "settings")}
              </nav>
            </header>
          `;
        }

        function renderHome() {
          return `
            <section class="dashboard-grid" aria-labelledby="home-title">
              <div class="learning-column">
                <section class="welcome-panel">
                  <p class="eyebrow">Socle prêt</p>
                  <h1 id="home-title">Bonjour ${escapeFileHtml(save.profile.name)}</h1>
                  <p>
                    Gagne des pièces avec tes bonnes réponses, puis complète ta
                    collection de tables, de modes et d'ambiances.
                  </p>
                  <div class="action-row">
                    <button class="button button-primary" type="button" data-route="multiplication">
                      Ouvrir les multiplications
                    </button>
                    <button class="button button-secondary" type="button" data-route="settings">
                      Choisir l'ambiance
                    </button>
                  </div>
                </section>
                <section class="subject-grid" aria-label="Domaines de maths">
                  ${renderSubject("&times;", "Multiplications", "Tables de 2 à 10.", "Boutique ouverte", "multiplication")}
                  ${renderSubject("&frac12;", "Fractions", "Socle réservé pour la suite.", "Plus tard")}
                  ${renderSubject("x", "Équations", "Une inconnue, tranquillement.", "Plus tard")}
                </section>
              </div>
              <aside class="panel" aria-labelledby="status-title">
                <p class="eyebrow">Progression</p>
                <h2 id="status-title">Tableau de bord</h2>
                <ul class="status-list">
                  <li><span>Pièces</span><strong>${save.rewards.coins}</strong></li>
                  <li><span>Tables prêtes</span><strong>${save.progress.multiplication.unlockedTables.join(", ")}</strong></li>
                  <li><span>Thème actif</span><strong>${getThemeLabel(save.settings.theme)}</strong></li>
                  <li><span>Sessions terminées</span><strong>${save.sessions.completed}</strong></li>
                </ul>
              </aside>
            </section>
          `;
        }

        function renderMultiplication() {
          return `
            <section class="shop-hero" aria-labelledby="multiplication-title">
              <div>
                <p class="eyebrow">Boutique des tables</p>
                <h1 id="multiplication-title">Choisis ton mode</h1>
                <p>Gagne des pièces, puis débloque des tables, modes et ambiances.</p>
              </div>
              <div class="coin-pill"><span aria-hidden="true">●</span><strong>${save.rewards.coins}</strong><span>pièces</span></div>
            </section>
            <section aria-labelledby="modes-title">
              <div class="section-heading">
                <p class="eyebrow">Modes</p>
                <h2 id="modes-title">Missions à choisir</h2>
              </div>
              <div class="shop-grid">
                ${modeItems.map(renderFileModeCard).join("")}
              </div>
            </section>
            <section aria-labelledby="tables-title">
              <div class="section-heading">
                <p class="eyebrow">Collectibles</p>
                <h2 id="tables-title">Tables à collectionner</h2>
              </div>
              <div class="shop-grid shop-grid--tables">
                ${renderFileInitialTables()}
                ${tableItems.map(renderFileTableCard).join("")}
              </div>
            </section>
          `;
        }

        function renderFileSession() {
          if (!fileSession) {
            return `
              <section class="panel" aria-labelledby="missing-session-title">
                <p class="eyebrow">Multiplications</p>
                <h1 id="missing-session-title">Aucune session en cours</h1>
                <p>Démarre une session courte depuis le module Multiplications.</p>
                <button class="button button-primary" type="button" data-route="multiplication">
                  Aller aux multiplications
                </button>
              </section>
            `;
          }

          if (fileSession.isComplete && !fileSession.feedback) {
            return `
              <section class="session-grid" aria-labelledby="summary-title">
                <div class="question-panel">
                  <p class="eyebrow">Session terminée</p>
                  <h1 id="summary-title">Beau travail</h1>
                  <p>Tu as répondu à ${fileSession.answeredCount} questions avec ${fileSession.correctCount} réussites.</p>
                  <div class="score-card">
                    <strong>${getFileAccuracy()}%</strong>
                    <span>de réussite sur cette session</span>
                  </div>
                  <div class="action-row">
                    <button class="button button-primary" type="button" data-start-session="${fileSession.modeId}">
                      Refaire une session
                    </button>
                    <button class="button button-secondary" type="button" data-end-session>
                      Retour au module
                    </button>
                  </div>
                </div>
                ${renderFileSessionSummaryAside()}
              </section>
            `;
          }

          return `
            <section class="session-grid" aria-labelledby="session-title">
              <div class="question-panel">
                <p class="eyebrow">Question ${fileSession.feedback ? fileSession.answeredCount : fileSession.answeredCount + 1} sur ${fileSession.totalQuestions}</p>
                <h1 id="session-title">À toi de jouer</h1>
                <progress class="session-progress" value="${fileSession.answeredCount}" max="${fileSession.totalQuestions}"></progress>
                <div class="question-box">
                  <p class="question-prompt">${fileSession.question.prompt}</p>
                  ${fileSession.question.mode === "visual-groups" ? renderFileVisualGroups(fileSession.question) : ""}
                </div>
                ${renderFileAnswerArea()}
              </div>
              ${renderFileSessionAside()}
            </section>
          `;
        }

        function renderFileAnswerArea() {
          return `
            <div class="answer-area">
              ${renderFileAnswerContent()}
            </div>
          `;
        }

        function renderFileAnswerContent() {
          if (fileSession.feedback) {
            const toneClass = fileSession.feedback.isCorrect ? " feedback-card--success" : "";

            return `
              <div class="feedback-card${toneClass}" role="status">
                ${fileSession.feedback.isCorrect ? '<span class="victory-burst" aria-hidden="true">★</span>' : ""}
                <h2>${fileSession.feedback.title}</h2>
                <p>${fileSession.feedback.message}</p>
                ${fileSession.feedback.explanation ? `<p>${fileSession.feedback.explanation}</p>` : ""}
                ${fileSession.feedback.autoAdvance ? '<p class="progress-line">Question suivante...</p>' : `
                  <button class="button button-primary" type="button" data-next-question>
                    Continuer
                  </button>
                `}
              </div>
            `;
          }

          if (fileSession.question.mode === "multiple-choice") {
            return `
              <div class="choice-grid" aria-label="Choix de réponses">
                ${fileSession.question.choices
                  .map((choice) => `<button class="choice-button" type="button" data-session-answer="${choice}">${choice}</button>`)
                  .join("")}
              </div>
            `;
          }

          return `
            <form class="answer-form" data-answer-form>
              <label class="answer-label" for="file-answer-input">Ta réponse</label>
              <div class="answer-row">
                <input id="file-answer-input" name="answer" class="answer-input" data-answer-input type="number" inputmode="numeric" min="0" required autocomplete="off">
                <button class="button button-primary" type="submit" data-submit-answer>Valider</button>
              </div>
            </form>
          `;
        }

        function renderFileSessionAside() {
          return `
            <aside class="panel" aria-labelledby="session-stats-title">
              <p class="eyebrow">En cours</p>
              <h2 id="session-stats-title">${getFileModeLabel(fileSession?.modeId)}</h2>
              <ul class="status-list">
                <li><span>Réponses</span><strong>${fileSession?.answeredCount || 0}/8</strong></li>
                <li><span>Réussites</span><strong>${fileSession?.correctCount || 0}</strong></li>
                <li><span>Score</span><strong>${getFileAccuracy()}%</strong></li>
              </ul>
            </aside>
          `;
        }

        function renderFileSessionSummaryAside() {
          return `
            <aside class="panel" aria-labelledby="session-summary-title">
              <p class="eyebrow">Détails</p>
              <h2 id="session-summary-title">Session terminée</h2>
              <ul class="status-list">
                <li><span>Réponses</span><strong>${fileSession?.answeredCount || 0}/8</strong></li>
                <li><span>Réussites</span><strong>${fileSession?.correctCount || 0}</strong></li>
                <li><span>Score</span><strong>${getFileAccuracy()}%</strong></li>
              </ul>
            </aside>
          `;
        }

        function renderSettings() {
          return `
            <section class="settings-grid" aria-labelledby="settings-title">
              <div class="panel">
                <p class="eyebrow">Ambiance</p>
                <h1 id="settings-title">Boutique des thèmes</h1>
                <p>Débloque une ambiance avec tes pièces, puis active-la.</p>
                <div class="theme-grid">
                  ${themes.map(renderThemeButton).join("")}
                </div>
              </div>
              <aside class="panel" aria-labelledby="wallet-title">
                <p class="eyebrow">Porte-pièces</p>
                <h2 id="wallet-title">${save.rewards.coins} pièces</h2>
                <ul class="status-list">
                  <li><span>Bonnes réponses</span><strong>${getFileTotalCorrect()}</strong></li>
                  <li><span>Thèmes possédés</span><strong>${save.rewards.ownedThemes.length}</strong></li>
                  <li><span>Actif</span><strong>${getThemeLabel(save.settings.theme)}</strong></li>
                </ul>
              </aside>
            </section>
          `;
        }

        function renderNavButton(label, targetRoute) {
          const activeClass = route === targetRoute ? " is-active" : "";
          const current = route === targetRoute ? ' aria-current="page"' : "";

          return `
            <button class="nav-button${activeClass}" type="button" data-route="${targetRoute}"${current}>
              ${label}
            </button>
          `;
        }

        function renderSubject(symbol, title, text, tag, targetRoute = null) {
          if (targetRoute) {
            return `
              <button
                class="subject-card subject-card--ready"
                type="button"
                data-route="${targetRoute}"
                aria-label="Ouvrir le module ${title}"
              >
                ${renderSubjectContent(symbol, title, text, tag)}
              </button>
            `;
          }

          return `
            <article class="subject-card${tag === "Module prêt" ? " subject-card--ready" : ""}">
              ${renderSubjectContent(symbol, title, text, tag)}
            </article>
          `;
        }

        function renderSubjectContent(symbol, title, text, tag) {
          return `
            <span class="subject-symbol" aria-hidden="true">${symbol}</span>
            <div><h2>${title}</h2><p>${text}</p></div>
            <span class="tag">${tag}</span>
          `;
        }

        function renderFileModeCard(mode) {
          const owned = isFileModeOwned(mode.id);

          return `
            <article class="shop-card${owned ? " is-owned" : ""}">
              <span class="subject-symbol" aria-hidden="true">${getFileModeIcon(mode.id)}</span>
              <div><h3>${mode.label}</h3><p>${mode.description}</p></div>
              <span class="tag">${mode.cost === 0 ? "Gratuit" : `${mode.cost} pièces`}</span>
              ${owned ? `
                <button class="button button-primary" type="button" data-start-session="${mode.id}">
                  Jouer
                </button>
              ` : renderFileBuyButton("mode", mode.id, canBuyFileMode(mode))}
            </article>
          `;
        }

        function renderFileInitialTables() {
          return save.progress.multiplication.unlockedTables
            .filter((table) => initialTables.includes(table))
            .map((table) => `
              <article class="shop-card table-card is-owned">
                <span class="table-token" aria-hidden="true">${table}</span>
                <div><h3>Table de ${table}</h3><p>Déjà dans ta collection.</p></div>
                <span class="tag">Possédée</span>
              </article>
            `)
            .join("");
        }

        function renderFileTableCard(item) {
          const owned = save.progress.multiplication.unlockedTables.includes(item.table);
          const currentPoints = getFilePointsForTables(item.requiredTables);

          return `
            <article class="shop-card table-card${owned ? " is-owned" : ""}">
              <span class="table-token" aria-hidden="true">${item.table}</span>
              <div><h3>${item.label}</h3><p>${item.description}</p></div>
              <p class="progress-line">Points: ${currentPoints}/${item.requiredPoints}</p>
              <span class="tag">${item.cost} pièces</span>
              ${owned ? '<span class="tag">Possédée</span>' : renderFileBuyButton("table", item.id, canBuyFileTable(item))}
            </article>
          `;
        }

        function renderFileBuyButton(type, id, canBuy) {
          return `
            <button
              class="button ${canBuy ? "button-primary" : "button-secondary"}"
              type="button"
              ${canBuy ? `data-buy-type="${type}" data-buy-id="${id}"` : "disabled"}
            >
              ${canBuy ? "Acheter" : "Verrouillé"}
            </button>
          `;
        }

        function renderThemeButton(theme) {
          const activeClass = theme.id === save.settings.theme ? " is-active" : "";
          const pressed = theme.id === save.settings.theme ? "true" : "false";
          const owned = isFileThemeOwned(theme.id);
          const canBuy = !owned && save.rewards.coins >= theme.cost;

          return `
            <article class="theme-button${activeClass}">
              <span
                class="theme-swatch"
                aria-hidden="true"
                style="--swatch-a: ${theme.swatch[0]}; --swatch-b: ${theme.swatch[1]}; --swatch-c: ${theme.swatch[2]};"
              ></span>
              <strong>${theme.label}</strong>
              <span>${theme.description}</span>
              ${owned ? `
                <button class="button button-primary" type="button" data-theme="${theme.id}" aria-pressed="${pressed}">
                  ${pressed === "true" ? "Actif" : "Utiliser"}
                </button>
              ` : `
                <button
                  class="button ${canBuy ? "button-primary" : "button-secondary"}"
                  type="button"
                  ${canBuy ? `data-buy-type="theme" data-buy-id="${theme.id}"` : "disabled"}
                >
                  Acheter ${theme.cost}
                </button>
              `}
            </article>
          `;
        }

        function getThemeLabel(themeId) {
          return themes.find((theme) => theme.id === themeId)?.label || "Soleil";
        }

        function buyFileItem(type, id) {
          if (type === "table") {
            const item = tableItems.find((table) => String(table.id) === String(id));

            if (item && canBuyFileTable(item)) {
              save.rewards.coins -= item.cost;
              save.progress.multiplication.unlockedTables = normalizeFileTables([
                ...save.progress.multiplication.unlockedTables,
                item.table
              ]);
              recordFilePurchase(type, id, item.cost);
            }
          }

          if (type === "mode") {
            const item = modeItems.find((mode) => mode.id === id);

            if (item && canBuyFileMode(item)) {
              save.rewards.coins -= item.cost;
              save.progress.multiplication.unlockedModes = normalizeFileModes([
                ...save.progress.multiplication.unlockedModes,
                item.id
              ], item.id === "mixed");
              save.progress.multiplication.mixedModeUnlocked =
                item.id === "mixed" || save.progress.multiplication.mixedModeUnlocked;
              recordFilePurchase(type, id, item.cost);
            }
          }

          if (type === "theme") {
            const item = themes.find((theme) => theme.id === id);

            if (item && !isFileThemeOwned(id) && save.rewards.coins >= item.cost) {
              save.rewards.coins -= item.cost;
              save.rewards.ownedThemes = normalizeFileThemes([
                ...save.rewards.ownedThemes,
                item.id
              ], item.id);
              save.settings.theme = item.id;
              document.documentElement.dataset.theme = item.id;
              recordFilePurchase(type, id, item.cost);
            }
          }

          save.updatedAt = new Date().toISOString();
          saveFileSave(save);
        }

        function recordFilePurchase(type, id, cost) {
          save.rewards.purchases.push({
            type,
            id: String(id),
            cost,
            purchasedAt: new Date().toISOString()
          });
        }

        function canBuyFileTable(item) {
          return !save.progress.multiplication.unlockedTables.includes(item.table) &&
            getFilePointsForTables(item.requiredTables) >= item.requiredPoints &&
            save.rewards.coins >= item.cost;
        }

        function canBuyFileMode(item) {
          if (isFileModeOwned(item.id) || save.rewards.coins < item.cost) {
            return false;
          }

          if (item.requirementType === "correct-total") {
            return getFileTotalCorrect() >= item.requirementValue;
          }

          if (item.requirementType === "table") {
            return save.progress.multiplication.unlockedTables.includes(item.requirementValue);
          }

          if (item.requirementType === "mixed") {
            return save.progress.multiplication.unlockedTables.length >= 3 &&
              ["direct-answer", "multiple-choice", "visual-groups", "missing-factor"]
                .every(isFileModeOwned);
          }

          return true;
        }

        function isFileModeOwned(modeId) {
          return save.progress.multiplication.unlockedModes.includes(modeId);
        }

        function isFileThemeOwned(themeId) {
          return save.rewards.ownedThemes.includes(themeId);
        }

        function getFilePointsForTables(requiredTables) {
          const points = normalizeFileTablePoints(save.progress.multiplication.tablePoints);

          return requiredTables.reduce((total, table) => total + (points[table] || 0), 0);
        }

        function getFileTotalCorrect() {
          const factSuccesses = Object.values(save.progress.multiplication.facts || {})
            .reduce((total, fact) => total + normalizeFileCount(fact?.successes), 0);

          return Math.max(save.rewards.totalCoinsEarned, factSuccesses);
        }

        function getFileModeIcon(modeId) {
          return {
            "direct-answer": "×",
            "multiple-choice": "4",
            "visual-groups": "●",
            "missing-factor": "?",
            mixed: "★"
          }[modeId] || "×";
        }

        function getFileModeLabel(modeId) {
          return {
            "direct-answer": "Réponse directe",
            "multiple-choice": "Choix rapide",
            "visual-groups": "Groupes visuels",
            "missing-factor": "Facteur caché",
            mixed: "Mode mélange"
          }[modeId] || "Session courte";
        }

        function getFilePageTitle(targetRoute) {
          if (targetRoute === "settings") {
            return "Réglages - EdukoMax";
          }

          if (targetRoute === "multiplication") {
            return "Multiplications - EdukoMax";
          }

          if (targetRoute === "multiplication-session") {
            return "Session multiplications - EdukoMax";
          }

          return "EdukoMax";
        }

        function createFileSession(modeId = "direct-answer") {
          const safeMode = isFileModeOwned(modeId) ? modeId : "direct-answer";

          return {
            modeId: safeMode,
            totalQuestions: 8,
            answeredCount: 0,
            correctCount: 0,
            index: 0,
            question: createFileQuestion(0, safeMode),
            feedback: null,
            isComplete: false
          };
        }

        function submitFileAnswerForm(form) {
          if (!form) {
            return false;
          }

          if (typeof form.reportValidity === "function" && !form.reportValidity()) {
            return false;
          }

          const answerValue = new FormData(form).get("answer");

          if (answerValue === null || String(answerValue).trim() === "") {
            return false;
          }

          const answer = Number(answerValue);
          answerFileSession(answer);
          return true;
        }

        function answerFileSession(value) {
          if (!fileSession || fileSession.feedback || fileSession.isComplete) {
            return;
          }

          const question = fileSession.question;
          const isCorrect = value === question.correctAnswer;

          updateFileFact(question, isCorrect);
          if (isCorrect) {
            rewardFileAnswer(question.table);
          }

          fileSession.answeredCount += 1;
          fileSession.correctCount += isCorrect ? 1 : 0;
          fileSession.feedback = createFileFeedback(question, value, isCorrect);

          if (fileSession.answeredCount >= fileSession.totalQuestions) {
            fileSession.isComplete = true;
            save.sessions.completed += 1;
            save.sessions.lastPlayedAt = new Date().toISOString();
          }

          save.updatedAt = new Date().toISOString();
          saveFileSave(save);
        }

        function advanceFileSession() {
          if (!fileSession) {
            return;
          }

          if (fileSession.isComplete) {
            fileSession.feedback = null;
            return;
          }

          fileSession.index += 1;
          fileSession.question = createFileQuestion(fileSession.index, fileSession.modeId);
          fileSession.feedback = null;
        }

        function createFileQuestion(index, modeId = "direct-answer") {
          const modes = ["direct-answer", "multiple-choice", "direct-answer", "missing-factor", "visual-groups", "multiple-choice", "direct-answer", "missing-factor"];
          const mode = modeId === "mixed" ? modes[index % modes.length] : modeId;
          const fact = chooseFileFact();
          const prompt = mode === "missing-factor"
            ? `${fact.table} x ? = ${fact.product}`
            : mode === "visual-groups"
              ? `${fact.factor} groupes de ${fact.table}, cela fait combien ?`
              : `${fact.table} x ${fact.factor} = ?`;

          return {
            ...fact,
            mode,
            prompt,
            correctAnswer: mode === "missing-factor" ? fact.factor : fact.product,
            choices: mode === "multiple-choice" ? createFileChoices(fact.product, fact.table) : []
          };
        }

        function chooseFileFact() {
          const tables = save.progress.multiplication.unlockedTables;
          const facts = tables.flatMap((table) =>
            [2, 3, 4, 5, 6, 7, 8, 9, 10].map((factor) => ({
              id: `${table}x${factor}`,
              table,
              factor,
              product: table * factor
            }))
          );

          return facts
            .map((fact) => ({
              fact,
              score: getFileFactPriority(save.progress.multiplication.facts[fact.id])
            }))
            .sort((first, second) => second.score - first.score)[0].fact;
        }

        function getFileFactPriority(factProgress) {
          if (!factProgress) {
            return 100;
          }

          const recentErrors = Array.isArray(factProgress.recentResults)
            ? factProgress.recentResults.filter((result) => !result.correct).length
            : 0;

          return 80 - (factProgress.mastery || 0) + recentErrors * 8;
        }

        function updateFileFact(question, isCorrect) {
          const fact = save.progress.multiplication.facts[question.id] || {
            attempts: 0,
            successes: 0,
            errors: 0,
            currentStreak: 0,
            bestStreak: 0,
            recentResults: [],
            lastAnsweredAt: null,
            averageResponseMs: null,
            mastery: 0
          };
          fact.attempts += 1;
          fact.successes += isCorrect ? 1 : 0;
          fact.errors += isCorrect ? 0 : 1;
          fact.currentStreak = isCorrect ? fact.currentStreak + 1 : 0;
          fact.bestStreak = Math.max(fact.bestStreak, fact.currentStreak);
          fact.recentResults = [
            ...fact.recentResults,
            { correct: isCorrect, answeredAt: new Date().toISOString() }
          ].slice(-10);
          fact.lastAnsweredAt = new Date().toISOString();
          fact.mastery = Math.round((fact.successes / fact.attempts) * 70) +
            Math.min(fact.currentStreak * 6, 30);
          save.progress.multiplication.facts[question.id] = fact;
        }

        function rewardFileAnswer(table) {
          save.rewards.coins += 1;
          save.rewards.totalCoinsEarned += 1;
          save.progress.multiplication.tablePoints = normalizeFileTablePoints(
            save.progress.multiplication.tablePoints
          );
          save.progress.multiplication.tablePoints[table] =
            (save.progress.multiplication.tablePoints[table] || 0) + 1;
        }

        function createFileChoices(correctAnswer, table) {
          return [correctAnswer, correctAnswer + table, correctAnswer - table, correctAnswer + 10]
            .filter((answer) => answer > 0)
            .filter((answer, index, list) => list.indexOf(answer) === index)
            .slice(0, 4)
            .sort((first, second) => first - second);
        }

        function createFileFeedback(question, value, isCorrect) {
          return {
            isCorrect,
            title: isCorrect ? "Bravo" : "On regarde ensemble",
            message: isCorrect
              ? "+1 pièce"
              : `Ta réponse ${value} est une bonne piste. La réponse attendue est ${question.correctAnswer}.`,
            explanation: isCorrect
              ? ""
              : `${question.table} x ${question.factor} = ${question.product}: on compte ${question.factor} groupes de ${question.table}.`,
            autoAdvance: isCorrect
          };
        }

        function renderFileVisualGroups(question) {
          return `
            <div class="visual-groups" aria-label="${question.factor} groupes de ${question.table}">
              ${Array.from({ length: question.factor }, () => `
                <span class="visual-group">
                  ${Array.from({ length: question.table }, () => '<i aria-hidden="true"></i>').join("")}
                </span>
              `).join("")}
            </div>
          `;
        }

        function getFileAccuracy() {
          if (!fileSession || fileSession.answeredCount === 0) {
            return 0;
          }

          return Math.round((fileSession.correctCount / fileSession.answeredCount) * 100);
        }

        function focusFileAnswerInput() {
          const answerInput = root.querySelector("[data-answer-input]");

          if (answerInput) {
            answerInput.focus();
          }
        }

        function scheduleFileAutoAdvance() {
          if (route !== "multiplication-session" || !fileSession?.feedback?.autoAdvance) {
            return;
          }

          fileAutoAdvanceTimer = window.setTimeout(() => {
            advanceFileSession();
            saveFileSave(save);
            renderFileApp();
          }, 850);
        }

        function clearFileAutoAdvance() {
          if (fileAutoAdvanceTimer !== null) {
            window.clearTimeout(fileAutoAdvanceTimer);
            fileAutoAdvanceTimer = null;
          }
        }
      }

      function loadFileSave() {
        try {
          const parsedSave = JSON.parse(localStorage.getItem("edukomax.save.v1"));
          return normalizeFileSave(parsedSave);
        } catch {
          return createFileSave();
        }
      }

      function saveFileSave(save) {
        try {
          localStorage.setItem("edukomax.save.v1", JSON.stringify(normalizeFileSave(save)));
        } catch {}
      }

      function fileTheme(id, label, description, cost, swatch) {
        return { id, label, description, cost, swatch };
      }

      function fileMode(id, label, description, cost, requirementType = null, requirementValue = 0) {
        return { id, label, description, cost, requirementType, requirementValue };
      }

      function fileTableItem(table, cost, requiredTables, requiredPoints) {
        return {
          id: String(table),
          table,
          label: `Table de ${table}`,
          description: `Ajoute la table de ${table} à tes missions.`,
          cost,
          requiredTables,
          requiredPoints
        };
      }

      function createFileSave() {
        const now = new Date().toISOString();

        return {
          version: 1,
          profile: { name: "Explorateur", createdAt: now },
          settings: { theme: "sunny", reducedMotion: false },
          progress: {
            multiplication: {
              unlockedTables: [2, 5, 10],
              mixedModeUnlocked: false,
              unlockedModes: ["direct-answer"],
              tablePoints: normalizeFileTablePoints({}),
              facts: {}
            },
            fractions: { unlocked: false },
            equations: { unlocked: false }
          },
          rewards: {
            xp: 0,
            stars: 0,
            coins: 0,
            totalCoinsEarned: 0,
            ownedThemes: ["sunny"],
            purchases: [],
            collectibles: []
          },
          sessions: { completed: 0, lastPlayedAt: null },
          updatedAt: now
        };
      }

      function normalizeFileSave(save) {
        const fallback = createFileSave();

        if (!save || typeof save !== "object" || Array.isArray(save)) {
          return fallback;
        }

        return {
          ...fallback,
          profile: {
            name: typeof save.profile?.name === "string" ? save.profile.name : fallback.profile.name,
            createdAt: typeof save.profile?.createdAt === "string" ? save.profile.createdAt : fallback.profile.createdAt
          },
          settings: {
            theme: normalizeFileTheme(save.settings?.theme),
            reducedMotion: Boolean(save.settings?.reducedMotion)
          },
          progress: {
            ...fallback.progress,
            multiplication: {
              unlockedTables: normalizeFileTables(save.progress?.multiplication?.unlockedTables),
              mixedModeUnlocked: Boolean(save.progress?.multiplication?.mixedModeUnlocked),
              unlockedModes: normalizeFileModes(
                save.progress?.multiplication?.unlockedModes,
                save.progress?.multiplication?.mixedModeUnlocked
              ),
              tablePoints: normalizeFileTablePoints(save.progress?.multiplication?.tablePoints),
              facts: save.progress?.multiplication?.facts || {}
            }
          },
          rewards: {
            xp: normalizeFileCount(save.rewards?.xp),
            stars: normalizeFileCount(save.rewards?.stars),
            coins: normalizeFileCount(save.rewards?.coins),
            totalCoinsEarned: normalizeFileCount(save.rewards?.totalCoinsEarned),
            ownedThemes: normalizeFileThemes(save.rewards?.ownedThemes, save.settings?.theme),
            purchases: Array.isArray(save.rewards?.purchases) ? save.rewards.purchases : [],
            collectibles: Array.isArray(save.rewards?.collectibles) ? save.rewards.collectibles : []
          },
          sessions: {
            completed: Number.isFinite(save.sessions?.completed) ? save.sessions.completed : 0,
            lastPlayedAt: typeof save.sessions?.lastPlayedAt === "string" ? save.sessions.lastPlayedAt : null
          },
          updatedAt: typeof save.updatedAt === "string" ? save.updatedAt : fallback.updatedAt
        };
      }

      function normalizeFileTheme(theme) {
        return ["sunny", "ocean", "berry"].includes(theme) ? theme : "sunny";
      }

      function normalizeFileTables(tables) {
        const cleanTables = Array.isArray(tables) ? tables.map(Number) : [];
        const requiredTables = [2, 5, 10, ...cleanTables];

        return [2, 5, 10, 3, 4, 6, 8, 9, 7].filter((table) =>
          requiredTables.includes(table)
        );
      }

      function normalizeFileModes(modes, mixedModeUnlocked = false) {
        const requestedModes = Array.isArray(modes) ? modes : [];
        const requiredModes = ["direct-answer", ...requestedModes];

        if (mixedModeUnlocked) {
          requiredModes.push("mixed");
        }

        return ["direct-answer", "multiple-choice", "visual-groups", "missing-factor", "mixed"]
          .filter((mode) => requiredModes.includes(mode));
      }

      function normalizeFileTablePoints(points) {
        const source = points && typeof points === "object" && !Array.isArray(points)
          ? points
          : {};

        return [2, 3, 4, 5, 6, 7, 8, 9, 10].reduce((cleanPoints, table) => {
          cleanPoints[table] = normalizeFileCount(source[table]);
          return cleanPoints;
        }, {});
      }

      function normalizeFileThemes(themes, activeTheme = "sunny") {
        const requestedThemes = Array.isArray(themes) ? themes : [];
        const requiredThemes = ["sunny", normalizeFileTheme(activeTheme), ...requestedThemes];

        return ["sunny", "ocean", "berry"].filter((theme) => requiredThemes.includes(theme));
      }

      function normalizeFileCount(value) {
        return Number.isFinite(value) && value >= 0 ? Math.round(value) : 0;
      }

      function getFileRoute() {
        const hashRoute = location.hash.replace("#", "");

        if (["home", "multiplication", "multiplication-session", "settings"].includes(hashRoute)) {
          return hashRoute;
        }

        return "home";
      }

      function escapeFileHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function showBootError(error) {
        const root = document.querySelector("[data-app-root]");

        if (!root) {
          return;
        }

        root.innerHTML = `
          <main class="loading-shell" aria-live="polite">
            <p>EdukoMax n'a pas pu démarrer. Ouvrez directement index.html, puis rechargez la page.</p>
          </main>
        `;
        console.error(error);
      }
    </script>
  </body>
</html>
