<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="EdukoMax, une application de maths lisible et ludique pour enfants."
    >
    <title>EdukoMax</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/themes.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <div id="app" data-app-root>
      <main class="loading-shell" aria-live="polite">
        <p>EdukoMax se pr&eacute;pare...</p>
      </main>
    </div>
    <script type="module">
      if (location.protocol === "file:") {
        showFileProtocolNotice();
      } else {
        import("./js/app.js").catch(showBootError);
      }

      function showFileProtocolNotice() {
        const root = document.querySelector("[data-app-root]");

        if (!root) {
          return;
        }

        root.innerHTML = `
          <main class="loading-shell" aria-live="polite">
            <h1>Serveur local requis</h1>
            <p>
              Cette application utilise des modules JavaScript.<br>
              Elle ne peut pas fonctionner en ouvrant directement le fichier.
            </p>
            <p>Lancez un serveur local, par&nbsp;exemple&nbsp;:</p>
            <pre><code>python -m http.server 8000</code></pre>
            <p>Puis ouvrez <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a></p>
          </main>
        `;
      }

      function showBootError(error) {
        const root = document.querySelector("[data-app-root]");

        if (!root) {
          return;
        }

        root.innerHTML = `
          <main class="loading-shell" aria-live="polite">
            <p>EdukoMax n&rsquo;a pas pu d&eacute;marrer. V&eacute;rifiez votre serveur local et rechargez la page.</p>
          </main>
        `;
        console.error(error);
      }
    </script>
  </body>
</html>
